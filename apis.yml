aid: range
name: Range
description: Range is team-communication and collaboration software from Range Labs that
  centralizes how teams stay in sync. It replaces status meetings with asynchronous daily
  check-ins, runs meetings with shared agendas and notes, tracks OKRs and goals against
  daily work, and provides a team directory, connecting to 75+ workplace tools including
  Slack, Microsoft Teams, Zoom, GitHub, Jira, Asana, and Google Workspace. Range publishes
  a JSON-over-REST API (base https://api.range.co/v1) for managing Teams, Users, and
  Check-ins (Updates), authenticated with API keys over HTTP Basic or OAuth 2.0 bearer
  tokens, plus an official Node.js SDK (range-sdk). It is backed by Bloomberg Beta and
  Scale Venture Partners.
